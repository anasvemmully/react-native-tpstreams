  // PRODUCTION BUILD (Remote Dependency):
  //   Uses: JitPack repository - fetches from GitHub
  //   Config: Line below (keep as-is for production)
  //
  implementation "com.github.anasvemmully:TPStreamsAndroidPlayer:feat~play-in-background-SNAPSHOT"
  //
  // LOCAL DEVELOPMENT (Local Project):
  //   For faster development without publishing changes
  //   Local path: /Users/chef/Desktop/work/TPStreamsAndroidPlayer
  //
